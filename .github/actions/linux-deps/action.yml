name: Linux build dependencies
description: >
  Install the GTK/WebKit packages Tauri needs to compile on Linux, with bounded
  waits and cached archives.

# Why this exists rather than an inline apt-get in each workflow:
#
# The step installs 135 packages, 55.5 MB of archives. Normally that takes about
# 25 seconds. Observed durations on this repo: 26s, 24s, 61s, 36s, then 8m36s,
# then over 30 minutes and still running. Two separate causes make that possible,
# and neither is the download itself (55 MB does not take 30 minutes):
#
#   1. The dpkg/apt lock. A fresh runner runs cloud-init and unattended-upgrades
#      at boot, which hold the package locks. apt then waits for the lock with no
#      timeout and prints nothing while it waits.
#   2. A stalled mirror connection. apt's default acquisition wait is effectively
#      unbounded.
#
# So this step: waits for cloud-init to finish, bounds the lock wait explicitly,
# bounds each apt invocation with `timeout`, retries transient network failures,
# caches the .deb archives so steady-state runs download nothing, and prints a
# timestamped line per phase so a future stall is attributable from the log
# instead of guessed at.
runs:
  using: composite
  steps:
    - name: Cache apt archives
      uses: actions/cache@v4
      with:
        path: /var/cache/apt/archives
        key: apt-archives-${{ runner.os }}-${{ hashFiles('.github/actions/linux-deps/action.yml') }}
        restore-keys: |
          apt-archives-${{ runner.os }}-

    - name: Install packages
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
        NEEDRESTART_MODE: a
        # Bound every wait instead of inheriting apt's unbounded defaults.
        APT_OPTS: >-
          -o Acquire::Retries=2
          -o Acquire::http::Timeout=15
          -o Acquire::https::Timeout=15
          -o Acquire::http::Pipeline-Depth=0
          -o DPkg::Lock::Timeout=300
      run: |
        set -euo pipefail
        # Timestamped phase markers: a stall is then attributable from the log.
        phase() { echo "::group::$* at $(date -u +%H:%M:%S)"; }

        phase "wait for cloud-init"
        # cloud-init's package writes are what hold the lock at boot. This is a
        # no-op once it has finished, and it is cheap.
        sudo cloud-init status --wait >/dev/null 2>&1 || true

        phase "apt-get update"
        sudo timeout 420 apt-get $APT_OPTS update

        phase "apt-get install"
        # The archive cache is restored as root; the cache action runs unprivileged.
        sudo chmod -R a+rX /var/cache/apt/archives 2>/dev/null || true
        # One hung acquisition can still evade the per-connection timeout and
        # burn the whole step timeout (observed 2026-11-06: exit 124 after
        # downloading 29 of the packages, 13 silent minutes on the 30th). A
        # retry resumes from the archive cache, so it is cheap, and converts a
        # stall from a failed job into a slower success.
        install_pkgs=(
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf
          libgtk-3-dev
          build-essential
          curl
          wget
          file
        )
        install_ok=false
        for attempt in 1 2 3; do
          echo "install attempt $attempt at $(date -u +%H:%M:%S)"
          if sudo timeout 900 apt-get $APT_OPTS install -y --no-install-recommends "${install_pkgs[@]}"; then
            install_ok=true
            break
          fi
          echo "::warning::apt-get install attempt $attempt failed at $(date -u +%H:%M:%S); retrying from the archive cache"
        done
        $install_ok || { echo "apt-get install failed after 3 attempts"; exit 1; }

        phase "verify"
        pkg-config --exists webkit2gtk-4.1 && echo "webkit2gtk-4.1 present"
        echo "::endgroup::"
